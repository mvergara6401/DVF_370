<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="quantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background with Safe Zone padding -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="rgba(99, 102, 241, 0.2)" stroke-width="4"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M 64 256 H 448 M 256 64 V 448 M 160 120 L 352 120 M 160 380 L 352 380" stroke="rgba(255, 255, 255, 0.06)" stroke-width="2"/>
  
  <!-- Volatility Smile Curve -->
  <path d="M 96 320 Q 256 160 416 280" fill="none" stroke="url(#quantGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Greek Delta / Quant Symbol -->
  <polygon points="256,120 160,320 352,320" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linejoin="round" opacity="0.85"/>
  
  <!-- Stochastic Nodes -->
  <circle cx="160" cy="320" r="10" fill="#38bdf8"/>
  <circle cx="256" cy="120" r="10" fill="#a855f7"/>
  <circle cx="352" cy="320" r="10" fill="#38bdf8"/>
  <circle cx="256" cy="220" r="8" fill="#f43f5e"/>
  
  <!-- Math Sigma Stylized Sub-mark -->
  <path d="M 226 380 H 286 L 256 420 L 286 460 H 226" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
